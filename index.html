<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9E9E9E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Акуму</title>
<style>
:root{color-scheme:dark;--bg:#000;--ink:#f4eef7;--mut:#a398ae}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}

/* Круглый экран — как на твоей плате ESP32 */
#scr{
  width:min(92vw, 92vh, 480px);
  aspect-ratio:1;
  border-radius:50%;
  border:6px solid #8b8b96;
  box-shadow:0 0 0 2px #3a3a42, 0 0 40px rgba(158,158,158,0.15);
  overflow:hidden;
  background:#000;
  position:relative;
}
canvas{width:100%;height:100%;display:block;touch-action:none}

/* Кнопка настроек — маленькая шестерёнка в правом верхнем углу круга */
#gear{
  position:absolute;top:12px;right:12px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
  transition:opacity .3s;
  opacity:0.5;
  z-index:10;
}
#gear:active{transform:scale(.92)}
#scr:hover #gear, #gear:focus{opacity:1}

/* Подсказка снизу */
#hint{
  color:var(--mut);font-size:13px;text-align:center;
  max-width:320px;opacity:.7;
}

/* Плавающая кнопка микрофона */
#mic{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,#9E9E9E,#616161);
  border:2px solid rgba(255,255,255,0.25);
  color:#fff;font-size:24px;cursor:pointer;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  transition:transform .15s;
}
#mic:active{transform:scale(.92)}
#mic.listening{
  background:linear-gradient(135deg,#ff4d5e,#c62828);
  animation:pulse 1.2s infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.6)}
  50%{box-shadow:0 0 0 16px rgba(255,77,94,0)}
}

/* Всплывающая подсказка с распознанной командой */
#toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,30,0.92);color:#fff;
  padding:10px 18px;border-radius:20px;
  font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .3s;
  max-width:80vw;text-align:center;
  backdrop-filter:blur(8px);
}
#toast.show{opacity:1}
</style></head><body>

<div id="scr">
  <button id="gear" aria-label="Настройки" onclick="location.href='settings.html'">⚙</button>
  <canvas id="c" aria-label="Акуму"></canvas>
</div>

<div id="hint">Води пальцем • Тап — подпрыгнет • Держи микрофон для команды</div>

<button id="mic" aria-label="Голосовая команда">🎤</button>

<div id="toast"></div>

// === ГОЛОСОВЫЕ КОМАНДЫ (пока базовые, расширим на Шаге 3) ===
function hear(q){
  touch();
  q=q.toLowerCase().trim();
  toast('«'+q+'»');
  if(/привет|здравств|здаров|хай/.test(q))return greet();
  if(/сколько.*врем|который час|врем[яю]/.test(q))return showTime();
  if(/спокойной ночи|споки|доброй ночи|спать/.test(q))return goodNight();
  if(/погод/.test(q))return showWeather();
  if(/дожд/.test(q))return setWx('rain');
  if(/снег/.test(q))return setWx('snow');
  if(/солн/.test(q))return setWx('sun');
  for(const [r,k] of [[/груст|плак/,'sad'],[/радост|весел|ура/,'joy'],[/зл[ао]|сердит/,'angry'],[/удив/,'surprise'],[/люб/,'love'],[/страш|бо[юя]с/,'scared'],[/спокой/,'calm']])
    if(r.test(q))return setEmo(k);
  toast('Не понял…');
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micBtn=$('#mic');
let recognition=null, listening=false;
if(SR){
  recognition=new SR();
  recognition.lang='ru-RU';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.onresult=e=>{
    const text=e.results[0][0].transcript;
    stopListening();
    hear(text);
  };
  recognition.onerror=e=>{
    stopListening();
    if(e.error==='not-allowed') toast('Дай доступ к микрофону');
    else if(e.error!=='aborted') toast('Ошибка микрофона');
  };
  recognition.onend=()=>stopListening();
}else{
  micBtn.style.display='none';
}

function startListening(){
  if(!recognition)return;
  try{
    recognition.start();
    listening=true;
    micBtn.classList.add('listening');
    toast('Слушаю…');
  }catch(e){}
}
function stopListening(){
  listening=false;
  micBtn.classList.remove('listening');
  try{recognition.abort()}catch(e){}
}
micBtn.addEventListener('click',()=>{
  touch();
  if(listening) stopListening();
  else startListening();
});

// Долгое нажатие на Акуму — тоже запускает микрофон
let longPressTimer=null;
cv.addEventListener('pointerdown',e=>{
  longPressTimer=setTimeout(()=>{
    if(!listening) startListening();
  },600);
});
cv.addEventListener('pointerup',()=>clearTimeout(longPressTimer));
cv.addEventListener('pointerleave',()=>clearTimeout(longPressTimer));
cv.addEventListener('pointermove',e=>{
  if(e.pressure===0) clearTimeout(longPressTimer);
});
